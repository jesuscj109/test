<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Escáner · Junta de Misiones</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f5f5f7; min-height: 100vh; }
    .app { max-width: 430px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; display: flex; flex-direction: column; gap: 1rem; }

    .brand { text-align: center; padding: .5rem 0; }
    .brand-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: #1a1a2e; }
    .brand-sub { font-size: 13px; color: #888; margin-top: 2px; }

    .card { background: #fff; border-radius: 18px; padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    label { font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
    select { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e5e5; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: #1a1a2e; background: #fafafa; outline: none; }
    input[type=text] { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e5e5; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #1a1a2e; background: #fafafa; outline: none; }
    input[type=text]:focus { border-color: #1a1a2e; background: #fff; }

    .counter { display: flex; gap: 8px; }
    .counter-box { flex: 1; background: #fff; border-radius: 14px; padding: .85rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .counter-num { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; color: #1a1a2e; }
    .counter-num.green { color: #27ae60; }
    .counter-label { font-size: 11px; color: #888; margin-top: 2px; }

    #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 1.5px solid #e5e5e5; background: #000; }

    .sep { display: flex; align-items: center; gap: .75rem; }
    .sep-line { flex: 1; height: .5px; background: #e0e0e0; }
    .sep-text { font-size: 12px; color: #aaa; }

    .manual-row { display: flex; gap: 8px; }
    .btn-confirm { padding: 12px 18px; border-radius: 12px; background: #1a1a2e; color: #fff; border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }

    /* MODAL DE CONFIRMACIÓN */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding: 0; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 430px; padding: 1.5rem 1.5rem 2.5rem; animation: slideUp .25s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto 1.25rem; }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 1rem; text-align: center; }
    .modal-profile { display: flex; align-items: center; gap: 1rem; background: #f5f5f7; border-radius: 16px; padding: 1rem; margin-bottom: 1.25rem; }
    .modal-photo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #e0e0e0; flex-shrink: 0; background: #e0e0e0; }
    .modal-name { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: #1a1a2e; line-height: 1.2; }
    .modal-mat { font-size: 13px; color: #888; margin-top: 4px; }
    .modal-junta { font-size: 12px; color: #1a1a2e; background: #e8eaf6; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-top: 8px; font-weight: 500; }
    .modal-actions { display: flex; gap: 10px; }
    .btn-accept { flex: 1; padding: 14px; border-radius: 14px; background: #27ae60; color: #fff; border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
    .btn-reject { flex: 1; padding: 14px; border-radius: 14px; background: #e74c3c; color: #fff; border: none; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 500; color: #fff; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.ok { background: #27ae60; }
    .toast.err { background: #e74c3c; }
    .toast.show { opacity: 1; }

    .no-junta-msg { text-align: center; background: #fff3cd; border-radius: 14px; padding: 1rem; font-size: 13px; color: #856404; }
  </style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="brand-title">Escáner de Asistencia</div>
    <div class="brand-sub">Solo para coordinadores · Pastoral Juvenil</div>
  </div>

  <div class="card">
    <label>Junta activa</label>
    <select id="sel-junta">
      <option value="">— Selecciona la junta —</option>
      <option value="Junta 1 - Inicio">Junta 1 - Inicio</option>
      <option value="Junta 1 - Final">Junta 1 - Final</option>
      <option value="Junta 2 - Inicio">Junta 2 - Inicio</option>
      <option value="Junta 2 - Final">Junta 2 - Final</option>
      <option value="Junta 3 - Inicio">Junta 3 - Inicio</option>
      <option value="Junta 3 - Final">Junta 3 - Final</option>
      <option value="Junta 4 - Inicio">Junta 4 - Inicio</option>
      <option value="Junta 4 - Final">Junta 4 - Final</option>
      <option value="Junta 5 - Inicio">Junta 5 - Inicio</option>
      <option value="Junta 5 - Final">Junta 5 - Final</option>
    </select>
  </div>

  <div class="counter">
    <div class="counter-box"><div class="counter-num green" id="cnt-ok">0</div><div class="counter-label">Confirmadas</div></div>
    <div class="counter-box"><div class="counter-num" id="cnt-rej" style="color:#e74c3c;">0</div><div class="counter-label">Rechazadas</div></div>
  </div>

  <div id="no-junta-msg" class="no-junta-msg">⚠️ Selecciona la junta activa antes de escanear.</div>

  <div id="reader"></div>

  <div class="sep">
    <div class="sep-line"></div>
    <div class="sep-text">o ingresa matrícula</div>
    <div class="sep-line"></div>
  </div>

  <div class="card">
    <label>Matrícula manual</label>
    <div class="manual-row">
      <input type="text" id="inp-manual" placeholder="Ej. 2310045" inputmode="numeric"
        onkeydown="if(event.key==='Enter') buscarAlumno(this.value.trim())" />
      <button class="btn-confirm" onclick="buscarAlumno(document.getElementById('inp-manual').value.trim())">Buscar</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">¿Confirmas la asistencia?</div>
    <div class="modal-profile">
      <img id="modal-photo" class="modal-photo" src="" onerror="this.src=''" />
      <div>
        <div class="modal-name" id="modal-nombre">—</div>
        <div class="modal-mat" id="modal-mat">—</div>
        <span class="modal-junta" id="modal-junta">—</span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-reject" id="btn-reject">✗ No es él/ella</button>
      <button class="btn-accept" id="btn-accept">✓ Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwqlsgxo9gaRjUq3O_w6v78o5CcJ4w1vBmZjFDF0FuiAmkUpYVOwXksmbX7O_BwbjSbSg/exec";
let procesando = false;
let pendiente = null;
let cntOk = 0, cntRej = 0;

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast ' + type, 2500);
}

function getJunta() {
  return document.getElementById('sel-junta').value;
}

document.getElementById('sel-junta').addEventListener('change', function() {
  document.getElementById('no-junta-msg').style.display = this.value ? 'none' : 'block';
});

async function buscarAlumno(matricula) {
  if (!matricula || procesando) return;
  if (!getJunta()) { toast('Selecciona la junta primero', 'err'); return; }
  procesando = true;
  document.getElementById('inp-manual').value = '';

  try {
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'login', matricula })
    });
    const data = await res.json();
    if (data.ok) {
      pendiente = { nombre: data.nombre, matricula, foto: data.foto };
      abrirModal(data.nombre, matricula, data.foto);
    } else {
      toast('Matrícula no registrada', 'err');
      procesando = false;
    }
  } catch(e) {
    toast('Error de conexión', 'err');
    procesando = false;
  }
}

function abrirModal(nombre, matricula, foto) {
  document.getElementById('modal-nombre').textContent = nombre;
  document.getElementById('modal-mat').textContent = 'Mat. ' + matricula;
  document.getElementById('modal-junta').textContent = getJunta();
  document.getElementById('modal-photo').src = foto || '';
  document.getElementById('modal').classList.add('active');
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('active');
  pendiente = null;
  procesando = false;
}

document.getElementById('btn-accept').addEventListener('click', async function() {
  if (!pendiente) return;
  const { nombre, matricula, foto } = pendiente;
  cerrarModal();

  try {
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'attendance', matricula, junta: getJunta() })
    });
    const data = await res.json();
    if (data.ok) {
      cntOk++;
      document.getElementById('cnt-ok').textContent = cntOk;
      toast('✓ ' + nombre + ' — asistencia registrada', 'ok');
    } else {
      toast('Error: ' + (data.msg || 'intenta de nuevo'), 'err');
    }
  } catch(e) {
    toast('Error de conexión', 'err');
  }
});

document.getElementById('btn-reject').addEventListener('click', async function() {
  if (!pendiente) return;
  const { matricula } = pendiente;
  cerrarModal();

  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'remove_attendance', matricula, junta: getJunta() })
    });
  } catch(e) {}

  cntRej++;
  document.getElementById('cnt-rej').textContent = cntRej;
  toast('✗ Asistencia rechazada', 'err');
});

// Cerrar modal tocando fuera
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) cerrarModal();
});

// QR Scanner
function onScanSuccess(text) {
  if (procesando) return;
  try {
    const data = JSON.parse(text);
    if (data.matricula) buscarAlumno(String(data.matricula));
  } catch(e) {
    buscarAlumno(text);
  }
}

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: { width: 220, height: 220 } },
  onScanSuccess, () => {}
).catch(() => {
  document.getElementById('reader').innerHTML =
    '<div style="padding:1.5rem;text-align:center;color:#888;font-size:13px;background:#fff;border-radius:16px;">Cámara no disponible.<br>Usa la entrada manual.</div>';
});
</script>
</body>
</html>
