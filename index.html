<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>Escáner · Junta de Misiones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;min-height:100vh;color:#1a1a2e}
.app{max-width:430px;margin:auto;padding:1rem 1.15rem 3rem;display:flex;flex-direction:column;gap:.85rem}
.brand{text-align:center;padding:.35rem 0}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:#888;margin-top:2px}
.card,.counter-box{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 2px 10px rgba(0,0,0,.05)}
label{font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
select,input{width:100%;padding:12px;border:1.5px solid #e3e3e3;border-radius:12px;font:inherit;font-size:16px;background:#fafafa;color:#1a1a2e;outline:none}
.counter{display:flex;gap:8px}.counter-box{flex:1;text-align:center;padding:.75rem}.num{font-size:25px;font-weight:800}.ok{color:#27ae60}.rej{color:#e74c3c}.label{font-size:10px;color:#888}
.warning{text-align:center;background:#fff3cd;color:#856404;border-radius:12px;padding:.8rem;font-size:12px}
#reader{width:100%;border-radius:16px;overflow:hidden;border:1.5px solid #ddd;background:#000}
.sep{display:flex;align-items:center;gap:.6rem}.line{flex:1;height:1px;background:#ddd}.septext{font-size:11px;color:#aaa}
.manual{display:flex;gap:8px}.manual button{padding:12px 16px;border:0;border-radius:12px;background:#1a1a2e;color:#fff;font-weight:800}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:30px;color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:300;white-space:nowrap}.toast.show{opacity:1}.toast.ok{background:#27ae60}.toast.err{background:#e74c3c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}.modal.active{display:flex}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:1.3rem 1.3rem 2rem}.handle{width:36px;height:4px;background:#ddd;border-radius:3px;margin:0 auto 1rem}.mtitle{text-align:center;font-size:13px;font-weight:800;color:#777;text-transform:uppercase;margin-bottom:.9rem}
.profile{display:flex;align-items:center;gap:.9rem;background:#f5f5f7;border-radius:15px;padding:.9rem;margin-bottom:1rem}.photo{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#ddd;border:3px solid #e1e1e1;flex-shrink:0}.name{font-size:19px;font-weight:800;line-height:1.15;word-break:break-word}.meta{font-size:12px;color:#888;margin-top:4px}.junta{display:inline-block;margin-top:7px;font-size:11px;background:#e8eaf6;padding:4px 9px;border-radius:20px}
.actions{display:flex;gap:9px}.actions button{flex:1;padding:14px;border:0;border-radius:13px;color:#fff;font-weight:800;font-size:15px}.confirm{background:#27ae60}.reject{background:#e74c3c}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="title">Escáner de Asistencia</div><div class="sub">Solo para coordinadores · Pastoral Juvenil</div></div>

  <div class="card">
    <label>Junta activa</label>
    <select id="junta">
      <option value="">— Selecciona la junta —</option>
      <option>Junta 1 - Inicio</option><option>Junta 1 - Final</option>
      <option>Junta 2 - Inicio</option><option>Junta 2 - Final</option>
      <option>Junta 3 - Inicio</option><option>Junta 3 - Final</option>
      <option>Junta 4 - Inicio</option><option>Junta 4 - Final</option>
      <option>Junta 5 - Inicio</option><option>Junta 5 - Final</option>
    </select>
  </div>

  <div class="counter">
    <div class="counter-box"><div class="num ok" id="cntOk">0</div><div class="label">Confirmadas</div></div>
    <div class="counter-box"><div class="num rej" id="cntRej">0</div><div class="label">Rechazadas</div></div>
  </div>

  <div class="warning" id="warning">⚠️ Selecciona la junta activa antes de escanear.</div>
  <div id="reader"></div>

  <div class="sep"><div class="line"></div><div class="septext">o ingresa matrícula</div><div class="line"></div></div>
  <div class="card">
    <label>Matrícula manual</label>
    <div class="manual"><input id="manual" inputmode="numeric" placeholder="Ej. 2310045"><button id="searchBtn">Buscar</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="handle"></div><div class="mtitle">¿Confirmas la asistencia?</div>
    <div class="profile"><img class="photo" id="mPhoto" alt="Foto"><div><div class="name" id="mName">—</div><div class="meta" id="mMat">—</div><div class="meta" id="mSalon">—</div><span class="junta" id="mJunta">—</span></div></div>
    <div class="actions"><button class="reject" id="reject">✗ No es él/ella</button><button class="confirm" id="confirm">✓ Confirmar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbx7tpyVuA4iFDEW7efr7tdlSAievxW6Nsiauy4eXEgWkEHN2AMbMpRTFDlZOBSPOoBd/exec";
const $=id=>document.getElementById(id);
let pending=null,working=false,okCount=0,rejCount=0;

function toast(msg,type){const t=$("toast");t.textContent=msg;t.className="toast "+type+" show";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="toast "+type,2200)}
function junta(){return $("junta").value}
function api(payload,timeout=10000){
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);
  return fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),signal:c.signal})
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).finally(()=>clearTimeout(timer));
}

$("junta").onchange=()=>{$("warning").style.display=junta()?"none":"block"};
$("searchBtn").onclick=()=>lookup($("manual").value.trim());
$("manual").onkeydown=e=>{if(e.key==="Enter")lookup($("manual").value.trim())};

async function lookup(mat){
  mat=String(mat||"").trim();
  if(!mat||working)return;
  if(!junta()){toast("Selecciona la junta primero","err");return}
  working=true;$("manual").value="";
  try{
    const d=await api({action:"login",matricula:mat});
    if(!d.ok){toast("Matrícula no registrada","err");return}
    pending={nombre:d.nombre,matricula:String(d.matricula||mat),salon:d.salon||"",foto:d.foto||""};
    openModal();
  }catch(e){toast("Error de conexión","err")}
  finally{working=false}
}

function openModal(){
  $("mName").textContent=pending.nombre;
  $("mMat").textContent="Mat. "+pending.matricula;
  $("mSalon").textContent=pending.salon?"Salón "+pending.salon:"";
  $("mJunta").textContent=junta();
  $("mPhoto").src=pending.foto||"";
  $("modal").classList.add("active");
}
function closeModal(){ $("modal").classList.remove("active");pending=null }

$("confirm").onclick=async()=>{
  if(!pending)return;
  const item={...pending,junta:junta()};
  closeModal();
  try{
    const d=await api({action:"attendance",matricula:item.matricula,junta:item.junta},10000);
    if(!d.ok)throw new Error(d.msg||"error");
    okCount++;$("cntOk").textContent=okCount;toast("✓ "+item.nombre+" — asistencia registrada","ok");
  }catch(e){toast("No se pudo registrar la asistencia","err")}
};

$("reject").onclick=async()=>{
  if(!pending)return;
  const item={...pending,junta:junta()};
  closeModal();
  // Solo se limpia si ya existía una marca previa. Si no existe, el servidor simplemente deja vacío.
  try{await api({action:"remove_attendance",matricula:item.matricula,junta:item.junta},8000)}catch(e){}
  rejCount++;$("cntRej").textContent=rejCount;toast("✗ Asistencia rechazada","err");
};

$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};

// Scanner: pausa lógica mientras se consulta al servidor para no disparar múltiples solicitudes.
function onScan(text){
  if(working||pending)return;
  let mat=text;
  try{const d=JSON.parse(text);if(d.matricula)mat=String(d.matricula)}catch(e){}
  lookup(mat);
}

const scanner=new Html5Qrcode("reader");
scanner.start(
  {facingMode:"environment"},
  {fps:8,qrbox:{width:240,height:240}},
  onScan,
  ()=>{}
).catch(()=>{
  $("reader").innerHTML='<div style="padding:1.4rem;text-align:center;color:#888;background:#fff;border-radius:15px;font-size:13px">Cámara no disponible.<br>Usa la entrada manual.</div>';
});
</script>
</body>
</html>
